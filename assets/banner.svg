<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .glow-circle {
        animation: pulse 6s ease-in-out infinite alternate;
      }
      .dash-line {
        stroke-dasharray: 8 8;
        animation: dash 20s linear infinite;
      }
      .node-pulse {
        animation: ping 3s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.7; transform: scale(1.02); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -100; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Background Dynamic / Animated Nodes & Connectors (Placed in background z-index) -->
  <g opacity="0.4">
    <!-- Glowing background Orbs -->
    <circle cx="200" cy="100" r="120" fill="#0284c7" opacity="0.25" filter="url(#glow)" class="glow-circle"/>
    <circle cx="1000" cy="250" r="140" fill="#7c3aed" opacity="0.25" filter="url(#glow)" class="glow-circle"/>

    <!-- Connecting Grid Lines -->
    <path d="M 100,175 L 300,100 L 500,175 L 700,100 L 900,175 L 1100,100" stroke="#38bdf8" stroke-width="1.5" fill="none" class="dash-line" opacity="0.5"/>
    <path d="M 100,175 L 300,250 L 500,175 L 700,250 L 900,175 L 1100,250" stroke="#818cf8" stroke-width="1.5" fill="none" class="dash-line" opacity="0.5"/>

    <!-- Dynamic Tech Flow Pills in Background -->
    <g transform="translate(100, 40)">
      <rect width="140" height="32" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="70" y="20" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="500">🤖 Agentic AI</text>
    </g>

    <g transform="translate(960, 40)">
      <rect width="140" height="32" rx="16" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.3"/>
      <text x="70" y="20" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="500">⚡ Omnichannel</text>
    </g>

    <g transform="translate(60, 270)">
      <rect width="150" height="32" rx="16" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.3"/>
      <text x="75" y="20" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="500">📊 SLA Orchestration</text>
    </g>

    <g transform="translate(980, 270)">
      <rect width="150" height="32" rx="16" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.3"/>
      <text x="75" y="20" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="500">🔓 Open-Source NLU</text>
    </g>

    <!-- Node circles -->
    <circle cx="300" cy="100" r="6" fill="#38bdf8"/>
    <circle cx="700" cy="100" r="6" fill="#c084fc"/>
    <circle cx="500" cy="175" r="8" fill="#818cf8"/>
    <circle cx="300" cy="250" r="6" fill="#818cf8"/>
    <circle cx="700" cy="250" r="6" fill="#34d399"/>
  </g>

  <!-- Foreground Main Content (Title and Subtitle clearly visible and prominent) -->
  <g text-anchor="middle">
    <!-- Icon/Badge Top -->
    <rect x="525" y="45" width="150" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="600" y="64" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURATED LIST 2026</text>

    <!-- Title -->
    <text x="600" y="145" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome AI Customer Service Assistant
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" opacity="0.95">
      Agentic AI Resolution • Omnichannel Automation • Conversation Modeling
    </text>

    <!-- Tagline/Stats -->
    <text x="600" y="240" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400">
      Comprehensive Directory of Production-Grade SaaS Platforms &amp; Open-Source Projects
    </text>

    <!-- Bottom Feature Pills -->
    <g transform="translate(340, 275)">
      <rect x="0" y="0" width="150" height="30" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="75" y="19" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">✨ Commercial SaaS</text>

      <rect x="175" y="0" width="170" height="30" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
      <text x="260" y="19" fill="#f0abfc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">🚀 Open-Source Engines</text>

      <rect x="365" y="0" width="155" height="30" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
      <text x="442" y="19" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13" font-weight="600">📈 Market Insights</text>
    </g>
  </g>
</svg>
